<body>
<div id="viewport">
  <canvas id="screen" tabindex="0" aria-label="Remote screen"></canvas>
</div>

<div id="banner" hidden role="status"></div>

<div id="status" role="status" aria-live="polite">
  <div class="state-card">
    <div class="state-icon" aria-hidden="true">
      <!-- Spinner: n3r4zzurr0/svg-spinners "90-ring-with-bg" (MIT). -->
      <svg class="spinner" viewBox="0 0 24 24"><path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z" opacity=".25"/><path class="spin" d="M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z"/></svg>
      <svg class="i glyph"><use href=""/></svg>
    </div>
    <h1 id="status-text">Connecting to your Mac</h1>
    <p id="status-detail"></p>
    <div id="status-actions"></div>
    <ul id="status-help" hidden></ul>
  </div>
</div>

<input id="kbd-sink" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Keyboard input">
<input id="file-input" type="file" multiple hidden>

<!-- The tools are drawn from web/js/tools.js (what's in the bar is the person's choice, see Edit toolbar).
     Whatever doesn't fit folds away from the end; More always lists every tool. -->
<nav id="toolbar" aria-label="Controls" data-dock="bottom-center">
  <button class="grip" data-action="move" aria-label="Move toolbar" data-tip="Move toolbar" data-hint="Drag to put it on any edge. Tap to pick a spot.">
    <svg class="i"><use href="icons.svg#dots-six-vertical"/></svg>
  </button>
  <button data-action="wholescreen" class="chip" hidden aria-label="Showing one window. Tap for the whole screen." data-tip="Whole screen" data-hint="You're seeing one window. Tap to see the whole screen again.">
    <svg class="i"><use href="icons.svg#desktop"/></svg><span>Whole screen</span>
  </button>
  <button data-action="viewonly" data-chip="viewonly" class="chip" hidden aria-label="View only. Tap to control again." data-tip="View only" data-hint="Your taps and typing don't reach the Mac. Tap to control it again.">
    <svg class="i"><use href="icons.svg#eye"/></svg><span>View only</span>
  </button>
  <div class="tools" role="group" aria-label="Tools"></div>
  <button data-action="more" aria-label="More" aria-haspopup="dialog" data-tip="More" data-hint="Every tool, plus Edit toolbar, help and tips.">
    <svg class="i"><use href="icons.svg#dots-three"/></svg><span class="lbl">More</span>
  </button>
</nav>
<button id="toolbar-show" hidden aria-label="Show toolbar" data-tip="Show toolbar" data-hint="Drag to move it.">
  <svg class="i"><use href="icons.svg#caret-up"/></svg>
</button>

<!-- Keys above the on-screen keyboard, while typing on a phone or iPad. Buttons keep the keyboard up. -->
<div id="keyrow" role="toolbar" aria-label="Keys" hidden>
  <div class="keys row1">
    <button data-mod="MetaLeft" aria-pressed="false" aria-label="Command">⌘</button>
    <button data-mod="AltLeft" aria-pressed="false" aria-label="Option">⌥</button>
    <button data-mod="ControlLeft" aria-pressed="false" aria-label="Control">⌃</button>
    <button data-mod="ShiftLeft" aria-pressed="false" aria-label="Shift">⇧</button>
    <button data-key="Escape" aria-label="Escape">esc</button>
    <button data-key="Tab" aria-label="Tab">tab</button>
  </div>
  <div class="keys row2">
    <button data-key="ArrowLeft" data-repeat aria-label="Left arrow">←</button>
    <button data-key="ArrowUp" data-repeat aria-label="Up arrow">↑</button>
    <button data-key="ArrowDown" data-repeat aria-label="Down arrow">↓</button>
    <button data-key="ArrowRight" data-repeat aria-label="Right arrow">→</button>
    <button data-key="Backspace" data-repeat aria-label="Delete">⌫</button>
    <button data-key="Enter" aria-label="Return">↩</button>
  </div>
  <button class="done" data-key-action="done" aria-label="Hide the keyboard"><svg class="i"><use href="icons.svg#caret-down"/></svg></button>
</div>

<!-- First-run tour: a ring around one real toolbar button and a card that explains it. -->
<div id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tour-title">
  <div class="tour-ring" aria-hidden="true"></div>
  <div class="tour-card">
    <h2 id="tour-title"></h2>
    <p id="tour-text"></p>
    <div class="row">
      <span class="tour-count" aria-hidden="true"></span>
      <button class="secondary" data-tour-action="skip">Skip</button>
      <button class="primary" data-tour-action="next">Next</button>
    </div>
  </div>
</div>

<div id="tips" hidden role="dialog" aria-modal="true" aria-labelledby="tip-title">
  <div class="tip-card">
    <svg class="i tip-icon" aria-hidden="true"><use href=""/></svg>
    <h2 id="tip-title"></h2>
    <p id="tip-text"></p>
    <div class="tip-dots" aria-hidden="true"></div>
    <div class="row">
      <button class="secondary" data-tip-action="skip">Skip</button>
      <button class="primary" data-tip-action="next">Next</button>
    </div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="handle" aria-hidden="true"></div>
    <header><h2 id="sheet-title"></h2><button class="close" data-close aria-label="Close"><svg class="i"><use href="icons.svg#x"/></svg></button></header>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" hidden role="status"></div>
<div id="tooltip" role="tooltip" hidden><strong></strong><span></span></div>
<div id="drop-hint" hidden><svg class="i"><use href="icons.svg#upload-simple"/></svg>Drop to send to the Mac's Downloads</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
