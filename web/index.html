<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tether">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<title>Tether</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="viewport">
  <canvas id="screen" tabindex="0" aria-label="Remote screen"></canvas>
</div>

<div id="banner" hidden role="status"></div>

<div id="status" role="status" aria-live="polite">
  <div class="state-card">
    <div class="state-icon" aria-hidden="true">
      <!-- Spinner: n3r4zzurr0/svg-spinners "90-ring-with-bg" (MIT). -->
      <svg class="spinner" viewBox="0 0 24 24"><path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z" opacity=".25"/><path class="spin" d="M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z"/></svg>
      <svg class="i glyph"><use href=""/></svg>
    </div>
    <h1 id="status-text">Connecting to your Mac</h1>
    <p id="status-detail"></p>
    <div id="status-actions"></div>
    <ul id="status-help" hidden></ul>
  </div>
</div>

<input id="kbd-sink" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Keyboard input">
<input id="file-input" type="file" multiple hidden>

<!-- data-prio: lower numbers stay in the toolbar longest; the rest fold into More. -->
<nav id="toolbar" aria-label="Controls" data-dock="bottom-center">
  <button class="grip" data-action="move" data-prio="0" aria-label="Move toolbar" data-tip="Move toolbar" data-hint="Drag to move it anywhere. Tap to pick a spot.">
    <svg class="i"><use href="icons.svg#dots-six-vertical"/></svg>
  </button>
  <div class="group" role="group" aria-label="Typing">
    <button data-action="keyboard" data-prio="1" aria-pressed="false" aria-label="Keyboard" data-tip="Keyboard" data-hint="Type on the Mac.">
      <svg class="i"><use href="icons.svg#keyboard"/></svg>
    </button>
    <div class="mods" role="group" aria-label="Modifier keys" data-prio="2">
      <button data-mod="MetaLeft" aria-pressed="false" aria-label="Command" data-tip="Command" data-hint="Tap: applies to the next key. Double-tap: stays on.">⌘</button>
      <button data-mod="AltLeft" aria-pressed="false" aria-label="Option" data-tip="Option" data-hint="Tap: applies to the next key. Double-tap: stays on.">⌥</button>
      <button data-mod="ControlLeft" aria-pressed="false" aria-label="Control" data-tip="Control" data-hint="Tap: applies to the next key. Double-tap: stays on.">⌃</button>
      <button data-mod="ShiftLeft" aria-pressed="false" aria-label="Shift" data-tip="Shift" data-hint="Tap: applies to the next key. Double-tap: stays on.">⇧</button>
    </div>
    <button data-action="compose" data-prio="4" aria-label="Compose" data-tip="Compose" data-hint="Write with autocorrect or dictation, then send it.">
      <svg class="i"><use href="icons.svg#pencil-simple-line"/></svg>
    </button>
    <button data-action="keys" data-prio="3" aria-label="Keys and shortcuts" data-tip="Keys and shortcuts" data-hint="Esc, arrows, function keys, Spotlight and more.">
      <svg class="i"><use href="icons.svg#lightning"/></svg>
    </button>
  </div>
  <div class="group" role="group" aria-label="Transfer">
    <button data-action="clipboard" data-prio="5" aria-label="Clipboard" data-tip="Clipboard" data-hint="Copy and paste between this device and the Mac.">
      <svg class="i"><use href="icons.svg#clipboard-text"/></svg>
    </button>
    <button data-action="files" data-prio="6" aria-label="Files" data-tip="Files" data-hint="Download from or upload to the Mac.">
      <svg class="i"><use href="icons.svg#folder-simple"/></svg>
    </button>
  </div>
  <div class="group" role="group" aria-label="Session">
    <button data-action="macs" class="conn" data-prio="9" aria-label="Connection" data-tip="Connection" data-hint="Connecting">
      <span class="dot" aria-hidden="true"></span><span class="conn-name">Mac</span>
    </button>
    <button data-action="sound" data-prio="8" aria-pressed="false" aria-label="Sound" data-tip="Sound" data-hint="Play the Mac's sound here.">
      <svg class="i"><use href="icons.svg#speaker-slash"/></svg>
    </button>
    <button data-action="settings" data-prio="7" aria-label="Display and quality" data-tip="Display and quality" data-hint="Screen, sharpness, touch mode and your other Macs.">
      <svg class="i"><use href="icons.svg#sliders-horizontal"/></svg>
    </button>
    <button data-action="fullscreen" data-prio="10" class="desktop-only" aria-label="Full screen" data-tip="Full screen">
      <svg class="i"><use href="icons.svg#arrows-out"/></svg>
    </button>
  </div>
  <button data-action="more" data-prio="0" aria-label="More" aria-haspopup="menu" aria-expanded="false" data-tip="More" data-hint="Everything that doesn't fit, plus tips.">
    <svg class="i"><use href="icons.svg#dots-three"/></svg>
  </button>
  <button data-action="hide" data-prio="11" aria-label="Hide toolbar" data-tip="Hide toolbar" data-hint="Shrinks it to a small button.">
    <svg class="i"><use href="icons.svg#caret-down"/></svg>
  </button>
</nav>
<button id="toolbar-show" hidden aria-label="Show toolbar" data-tip="Show toolbar" data-hint="Drag to move it.">
  <svg class="i"><use href="icons.svg#caret-up"/></svg>
</button>

<div id="tips" hidden role="dialog" aria-modal="true" aria-labelledby="tip-title">
  <div class="tip-card">
    <svg class="i tip-icon" aria-hidden="true"><use href=""/></svg>
    <h2 id="tip-title"></h2>
    <p id="tip-text"></p>
    <div class="tip-dots" aria-hidden="true"></div>
    <div class="row">
      <button class="secondary" data-tip-action="skip">Skip</button>
      <button class="primary" data-tip-action="next">Next</button>
    </div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="handle" aria-hidden="true"></div>
    <header><h2 id="sheet-title"></h2><button class="close" data-close aria-label="Close"><svg class="i"><use href="icons.svg#x"/></svg></button></header>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" hidden role="status"></div>
<div id="tooltip" role="tooltip" hidden><strong></strong><span></span></div>
<div id="drop-hint" hidden><svg class="i"><use href="icons.svg#upload-simple"/></svg>Drop to send to the Mac's Downloads</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
