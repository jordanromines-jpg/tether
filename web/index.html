<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tether">
<meta name="theme-color" content="#0b0b0d">
<title>Tether</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="viewport">
  <canvas id="screen" tabindex="0" aria-label="Remote screen"></canvas>
</div>

<div id="banner" hidden role="status"><span class="text"></span></div>

<div id="status" role="status">
  <div class="status-card">
    <div class="spinner"></div>
    <p id="status-text">Connecting to your Mac…</p>
    <p id="status-detail" class="muted"></p>
  </div>
</div>

<input id="kbd-sink" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Keyboard input">
<input id="file-input" type="file" multiple hidden>

<nav id="toolbar" aria-label="Controls">
  <button data-action="keyboard" title="Keyboard" aria-label="Show keyboard">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
  </button>
  <div class="mods" role="group" aria-label="Modifier keys">
    <button data-mod="MetaLeft" aria-pressed="false" title="Command">⌘</button>
    <button data-mod="AltLeft" aria-pressed="false" title="Option">⌥</button>
    <button data-mod="ControlLeft" aria-pressed="false" title="Control">⌃</button>
    <button data-mod="ShiftLeft" aria-pressed="false" title="Shift">⇧</button>
  </div>
  <button data-action="compose" title="Compose text (autocorrect, dictation)" aria-label="Compose text">
    <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
  </button>
  <button data-action="keys" title="More keys" aria-label="More keys">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
  </button>
  <span class="sep"></span>
  <button data-action="clipboard" title="Clipboard" aria-label="Clipboard">
    <svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/></svg>
  </button>
  <button data-action="files" title="Files" aria-label="Files">
    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </button>
  <button data-action="sound" aria-pressed="false" title="Sound" aria-label="Sound">
    <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  </button>
  <button data-action="settings" title="Display & quality" aria-label="Display and quality">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
  </button>
  <button data-action="fullscreen" class="desktop-only" title="Full screen" aria-label="Full screen">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button data-action="hide" title="Hide toolbar" aria-label="Hide toolbar">
    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</nav>
<button id="toolbar-show" hidden aria-label="Show toolbar">
  <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
</button>

<div id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title"></h2><button class="close" data-close aria-label="Close">✕</button></header>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" hidden></div>
<div id="drop-hint" hidden>Drop to send to the Mac’s Downloads</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
